<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calc</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh; /* لتوسيط العنصر عمودياً أيضاً */
      }

      section {
        margin: 1rem auto;
        width: 300px;
        height: 600px;
        /* border-radius: 2rem; */
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        flex-wrap: wrap;
        align-content: space-between;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2),
          0 6px 20px 0 rgba(0, 0, 0, 0.19);
      }

      .input {
        position: absolute;
        top: 0;
        background-color: white;
        width: 100%;
        height: 100px;
        color: black;
        font-weight: bold;
        font-size: 2rem;
        border-bottom: 5px solid #000;
        padding: 1rem;
      }
      .up {
        height: 400px;
        width: 100%;
        position: absolute;
        bottom: 10%;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        align-content: space-between;
        gap: 0.5rem;
      }
      aside {
        text-align: center;
        color: black;
        width: 2rem;
        height: 2rem;
        padding: 2rem;
        border: 2px solid #000;
        cursor: pointer;
        font-weight: bold;
        font-size: 1.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .eq {
        background-color: rgb(96, 107, 255);
        color: white;
      }
      aside:hover {
        background-color: hsl(60, 2%, 17%);
        color: aliceblue;
      }
    </style>
  </head>

  <body>
    <section class="con">
      <div class="input"></div>
      <div class="up">
        <aside>C</aside>
        <aside>/</aside>
        <aside>*</aside>
        <aside>&larr;</aside>
        <aside>7</aside>
        <aside>8</aside>
        <aside>9</aside>
        <aside>-</aside>
        <aside>4</aside>
        <aside>5</aside>
        <aside>6</aside>
        <aside>+</aside>
        <aside>1</aside>
        <aside>2</aside>
        <aside>3</aside>
        <aside>.</aside>
        <aside>(</aside>
        <aside>0</aside>
        <aside>)</aside>
        <aside class="eq">=</aside>
      </div>
    </section>

    <script>
      let input = document.querySelector(".input");
      let buttons = Array.from(document.querySelectorAll("aside"));

      buttons.map((button) => {
        button.addEventListener("click", (e) => {
          switch (e.target.innerText) {
            case "C":
              input.innerText = "";
              break;
            case "←":
              input.innerText = input.innerText.slice(0, -1);
              break;
            case "=":
              try {
                input.innerText = eval(input.innerText);
              } catch {
                input.innerText = "Error!";
              }
              break;
            default:
              input.innerText += e.target.innerText;
              break;
          }
        });
      });
    </script>
  </body>
</html>
